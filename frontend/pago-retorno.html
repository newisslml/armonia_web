<script src="js/main.js"></script>
<script>
  async function confirmarPago(token) {
    const cont = document.getElementById('pagoResultado');
    try {
      const data = await apiFetch('/pagos/webpay/confirmar', {
        method: 'POST',
        body: JSON.stringify({ token_ws: token }),
      });
      cont.innerHTML = data.aprobado
        ? '<p>✅ Pago aprobado. Gracias por tu compra.</p><a class="btn btn-primary" href="mi-cuenta.html">Ver mis pedidos</a>'
        : '<p>❌ Pago rechazado.</p><a class="btn btn-ghost" href="carrito.html">Volver al carrito</a>';
    } catch (err) {
      cont.innerHTML = `<p class="cat-empty">${err.message}</p>`;
    }
  }

  const params = new URLSearchParams(location.search);
  const token = params.get('token_ws');

  if (token) {
    confirmarPago(token);
  } else {
    // Transbank confirma con un POST al returnUrl, y una página estática no
    // puede leer el body de un POST — se necesita un endpoint del backend
    // que reciba ese POST y redirija acá con el token como query, o similar.
    // Mientras tanto: permite pegarlo a mano para poder probar el flujo en sandbox.
    document.getElementById('pagoResultado').innerHTML = `
      <p class="cat-empty">No encontramos el token en la URL. Transbank normalmente lo envía por POST, que esta página estática no puede leer — hace falta un endpoint del backend para recibirlo y redirigir acá. Si estás probando en sandbox, pega el token_ws manualmente:</p>
      <form id="tokenForm" class="auth-form">
        <input type="text" name="token_ws" placeholder="token_ws" required>
        <button class="btn btn-primary" type="submit">Confirmar</button>
      </form>`;
    document.getElementById('tokenForm').addEventListener('submit', (e) => {
      e.preventDefault();
      confirmarPago(new FormData(e.target).get('token_ws'));
    });
  }
</script>
